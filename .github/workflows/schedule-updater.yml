name: update-companies-data
on:
  schedule:
    # Runs "at 18:45 (Nepal Time), every Monday to Friday
    - cron: "0 13,14,15,16,17 * * 0,1,2,3,4,5"
  workflow_dispatch:
defaults:
  run:
    working-directory: ./src
jobs:
  update-daily-data:
    name: update-daily-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # 3.8 was removed from GitHub runner images (EOL); 3.10 is the newest that still has wheels for the pinned pandas 1.4.1 / lxml 4.9.1
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run updater
        run: python dailyDataScrapper.py
      - name: Setup Git
        run: git config --local user.email "aabishkar2@gmail.com" && git config --local user.name "Aabishkar Wagle Bot"
      - name: Commit Files
        id: commit
        run: |
          git stage ../data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update data"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
